    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Apple65Core.swift
      - path: W3Apple65App.swift
      - path: ../../.omx/artifacts/w3-apple65-probe-preparation-20261116/AudioFixtures
        type: folder
        buildPhase: resources
      - path: source-identity-manifest.json
        buildPhase: resources
    dependencies:
      - package: apple
        product: ODAIKitCore
      - package: apple
        product: ODAIKitSpeech
      - package: apple
        product: ODAIKitAppleSpeech
    settings:
      base:
        PRODUCT_NAME: W3Apple65File
        PRODUCT_BUNDLE_IDENTIFIER: io.ondeviceai.probe.w3apple65file20261116
