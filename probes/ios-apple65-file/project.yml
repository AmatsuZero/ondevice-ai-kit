        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 15.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used only by an explicit manual FILE evaluation to transcribe bundled audio files."
