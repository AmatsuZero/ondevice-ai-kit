name: IOSVideoSRProbe
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
targets:
  IOSVideoSRProbe:
    type: application
    platform: iOS
    sources:
      - IOSVideoSRProbeApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ondeviceai.probe.videosr
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4X996UV8LC
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
