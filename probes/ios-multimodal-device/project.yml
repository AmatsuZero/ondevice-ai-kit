name: MultimodalDevice
options:
  bundleIdPrefix: io.ondeviceai
packages:
  OnDeviceAIKit:
    path: __APPLE__
  OnDeviceAIKitAppleMLX:
    path: __MLX__
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ODAI_DEMO_BINDING"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MultimodalDevice:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: __SOURCES__
    dependencies:
      - framework: __FRAMEWORK__
        embed: false
      - package: OnDeviceAIKit
        product: ODAIKitCore
      - package: OnDeviceAIKit
        product: ODAIKitMultimodal
      - package: OnDeviceAIKit
        product: ODAIKitModelStore
      - package: OnDeviceAIKitAppleMLX
        product: ODAIKitAppleMLXVLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ondeviceai.multimodallifecycle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ODAISourceCommit: __COMMIT__
        TARGETED_DEVICE_FAMILY: 1,2
