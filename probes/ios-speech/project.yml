name: IOSSpeechProbe
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
packages:
  OnDeviceAIKit:
    path: ../../apple
targets:
  IOSSpeechProbe:
    type: application
    platform: iOS
    sources:
      - IOSSpeechProbeApp.swift
      - ASRFileProbe.swift
      - ASRProbeState.swift
      - path: ../../artifacts/P6IOSASR/fixture/asr-fixture.caf
        buildPhase: resources
    dependencies:
      - package: OnDeviceAIKit
        product: ODAIKitAppleSpeech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ondeviceai.probe.speech
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4X996UV8LC
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: '识别固定合成语音文件，强制本机识别，不上传音频。'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
