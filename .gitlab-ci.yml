# 窄 CI：只守门离线纯 Python 测试子集（tools/ci-pure-tests.txt）。
# 不跑真机/听感/通知关联/复审/签名——那些保持人工，在清单里如实标 open。
stages:
  - test

offline-tests:
  stage: test
  image: nexus.ugaiot.com/docker-ugreenhome-release/build-performance-python@sha256:3dc01f342e31ad8de39338d14ab12de0090c9102b34f75ca9774ff1f4f5e904e
  tags:
    - aiot-fe-runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    # 统一走 Makefile 入口；测试零第三方依赖，docker runner 无需 uv。
    - make test-offline

# 苹果端原生测试正式 job（自动触发，与 Python/Kotlin job 并列）：
# 在 runner #9 上跑 KMP iOS Native 测试（kmp-binding + demo/shared 的 commonTest），带 NAS 缓存与进程清理。
# runner #9 与主工程共享，用 resource_group 串行；Apple 工具 Python 测试因 runner 缺 xcodegen 暂不纳入。
ios-native-tests:
  stage: test
  # 只用 runner #9：#9 独有 tag xcode-cas-consumer-9（#17 是 xcode-cas-producer-17）。
  tags:
    - macos
    - xcode-cas-consumer-9
  resource_group: macos-shared
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never
  variables:
    DERIVED_DATA_PATH: "${CI_BUILDS_DIR}/derived_data/ondevice-${CI_JOB_ID}"
    # NAS 缓存配方抄自 ugreenhome-shared 的 .ios_build：Gradle 缓存落到工程内目录，由 cache paths 捕获。
    GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.ci-gradle"
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - gradle/libs.versions.toml
      prefix: ios-native-tests-v1
    paths:
      - .ci-gradle/caches/
      - .ci-gradle/wrapper/
      - .ci-konan/
  script:
    - bash tools/probe/ios-native-probe.sh
  after_script:
    - bash tools/probe/ios-native-cleanup.sh || echo "cleanup failed (non-fatal)"
